[build-system]
requires = [
    "setuptools>=68.0.0",
    "wheel>=0.40.0",
    "pybind11>=2.11.0",
    "cmake>=3.21.0",
    "ninja; platform_system!='Windows'",
    "scikit-build-core>=0.5.0",
    "pathspec",
    "packaging",
]
build-backend = "scikit_build_core.build"

[project]
name = "atom"
version = "1.0.0"
description = "Foundational library for astronomical software"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "Max Qian", email = "your.email@example.com" }]
maintainers = [{ name = "Max Qian", email = "your.email@example.com" }]
keywords = ["astronomy", "science", "cpp", "python-bindings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=1.20.0",
    "psutil>=7.0.0",
    "pybind11>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
test = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-benchmark>=4.0.0"]
docs = ["sphinx>=5.0.0", "sphinx-rtd-theme>=1.0.0", "myst-parser>=0.18.0"]

[project.urls]
Homepage = "https://github.com/ElementAstro/Atom"
Documentation = "https://atom.readthedocs.io/"
Repository = "https://github.com/ElementAstro/Atom.git"
"Bug Tracker" = "https://github.com/ElementAstro/Atom/issues"

[tool.setuptools]
packages = ["atom"]

[tool.setuptools.package-data]
atom = ["py.typed", "*.pyi"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=atom",
    "--cov-report=html:coverage/python/html",
    "--cov-report=xml:coverage/python/coverage.xml",
    "--cov-report=term-missing",
    "--cov-branch",
    "--cov-fail-under=75"
]
testpaths = ["tests", "python/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as performance benchmarks",
    "unit: marks tests as unit tests",
    "functional: marks tests as functional tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["atom", "python"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
]
branch = true
data_file = "coverage/python/.coverage"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "coverage/python/html"
title = "Atom Python Coverage Report"

[tool.coverage.xml]
output = "coverage/python/coverage.xml"

# -----------------------------------------------------------------------------
# Scikit-build-core configuration for optimized C++ extension building
# -----------------------------------------------------------------------------
[tool.scikit-build]
# Minimum CMake version
cmake.minimum-version = "3.21"

# Build directory
build-dir = "build/{wheel_tag}"

# CMake configuration
cmake.args = [
    "-DCMAKE_BUILD_TYPE=Release",
    "-DATOM_BUILD_PYTHON_BINDINGS=ON",
    "-DATOM_ENABLE_CCACHE=ON",
    "-DATOM_ENABLE_LTO=ON",
    "-DATOM_ENABLE_PRECOMPILED_HEADERS=ON",
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
]

# Platform-specific CMake arguments
cmake.define = { "CMAKE_OSX_DEPLOYMENT_TARGET" = "10.15" }

# Ninja generator preference
cmake.build-type = "Release"
ninja.make-fallback = true

# Parallel build configuration
cmake.build.parallel = true

# Install configuration
install.components = ["python"]
install.strip = false

# Wheel configuration
wheel.expand-macos-universal-tags = true
wheel.install-dir = "atom"
wheel.packages = ["python/atom"]

# Source distribution configuration
sdist.include = [
    "atom/**/*.hpp",
    "atom/**/*.h",
    "cmake/**/*.cmake",
    "extra/**/*",
    "python/**/*.cpp",
    "python/**/*.hpp",
    "python/**/*.py",
    "CMakeLists.txt",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

sdist.exclude = [
    "build/**",
    "dist/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    ".git/**",
    ".github/**",
    "docs/**",
    "tests/**",
    "example/**",
]

# Metadata configuration
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# -----------------------------------------------------------------------------
# Cross-platform wheel building configuration
# -----------------------------------------------------------------------------
[tool.cibuildwheel]
# Build wheels for these Python versions
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*"]

# Skip 32-bit builds and PyPy
skip = ["*-win32", "*-manylinux_i686", "pp*"]

# Build configuration
build-verbosity = 1

# Environment variables for all platforms
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }

# Platform-specific configurations
[tool.cibuildwheel.linux]
before-all = [
    "yum install -y cmake3 ninja-build ccache || apt-get update && apt-get install -y cmake ninja-build ccache",
]

[tool.cibuildwheel.linux.environment]
CMAKE_BUILD_PARALLEL_LEVEL = "4"
CCACHE_DIR = "/tmp/ccache"
CC = "ccache gcc"
CXX = "ccache g++"

[tool.cibuildwheel.macos]
before-all = [
    "brew install cmake ninja ccache",
]

[tool.cibuildwheel.macos.environment]
CMAKE_BUILD_PARALLEL_LEVEL = "4"
CCACHE_DIR = "/tmp/ccache"
CC = "ccache clang"
CXX = "ccache clang++"
MACOSX_DEPLOYMENT_TARGET = "10.15"

[tool.cibuildwheel.windows]
before-all = [
    "choco install cmake ninja -y",
]

[tool.cibuildwheel.windows.environment]
CMAKE_BUILD_PARALLEL_LEVEL = "4"
CMAKE_GENERATOR = "Ninja"
