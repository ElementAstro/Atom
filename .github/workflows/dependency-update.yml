name: Dependency Updates

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update to perform'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - vcpkg
        - submodules
        - python

jobs:
  # Update vcpkg baseline
  update-vcpkg:
    name: Update vcpkg Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.update_type == 'all' || github.event.inputs.update_type == 'vcpkg'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Get latest vcpkg commit
      id: vcpkg-commit
      run: |
        LATEST_COMMIT=$(curl -s https://api.github.com/repos/microsoft/vcpkg/commits/master | jq -r '.sha')
        echo "commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest vcpkg commit: $LATEST_COMMIT"

    - name: Update vcpkg.json baseline
      run: |
        # Update builtin-baseline in vcpkg.json
        jq --arg commit "${{ steps.vcpkg-commit.outputs.commit }}" \
           '.["builtin-baseline"] = $commit' \
           vcpkg.json > vcpkg.json.tmp && mv vcpkg.json.tmp vcpkg.json

    - name: Test vcpkg update
      run: |
        # Clone vcpkg and test the new baseline
        git clone https://github.com/Microsoft/vcpkg.git vcpkg-test
        cd vcpkg-test
        git checkout ${{ steps.vcpkg-commit.outputs.commit }}
        ./bootstrap-vcpkg.sh
        
        # Test installing our dependencies
        ./vcpkg install --triplet x64-linux openssl zlib sqlite3 fmt || {
          echo "Failed to install dependencies with new baseline"
          exit 1
        }

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update vcpkg baseline to ${{ steps.vcpkg-commit.outputs.commit }}'
        title: 'Update vcpkg baseline'
        body: |
          This PR updates the vcpkg baseline to the latest commit.
          
          **Changes:**
          - Updated `builtin-baseline` in `vcpkg.json` to `${{ steps.vcpkg-commit.outputs.commit }}`
          
          **Testing:**
          - [x] Verified that core dependencies can be installed with the new baseline
          - [x] Automated tests will run on this PR
          
          This is an automated update created by the dependency update workflow.
        branch: update/vcpkg-baseline
        delete-branch: true

  # Update git submodules
  update-submodules:
    name: Update Git Submodules
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.update_type == 'all' || github.event.inputs.update_type == 'submodules'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: recursive
        fetch-depth: 0

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Update submodules
      run: |
        git submodule update --remote --merge
        
        # Check if there are any changes
        if git diff --quiet --exit-code; then
          echo "No submodule updates available"
          echo "has_changes=false" >> $GITHUB_ENV
        else
          echo "Submodule updates found"
          echo "has_changes=true" >> $GITHUB_ENV
        fi

    - name: Get submodule changes
      if: env.has_changes == 'true'
      run: |
        echo "## Submodule Updates" > submodule_changes.md
        echo "" >> submodule_changes.md
        
        git submodule foreach --quiet 'echo "### $name"'
        git submodule foreach --quiet 'git log --oneline HEAD@{1}..HEAD || echo "No changes"'

    - name: Create Pull Request
      if: env.has_changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update git submodules'
        title: 'Update git submodules'
        body-path: submodule_changes.md
        branch: update/submodules
        delete-branch: true

  # Update Python dependencies
  update-python-deps:
    name: Update Python Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.update_type == 'all' || github.event.inputs.update_type == 'python'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Check for Python requirements files
      run: |
        if [ -f requirements.txt ]; then
          echo "found_requirements=true" >> $GITHUB_ENV
        elif [ -f pyproject.toml ]; then
          echo "found_pyproject=true" >> $GITHUB_ENV
        else
          echo "No Python dependency files found"
          exit 0
        fi

    - name: Update requirements.txt
      if: env.found_requirements == 'true'
      run: |
        # Install current requirements
        pip install -r requirements.txt
        
        # Generate updated requirements
        pip list --outdated --format=json > outdated.json
        
        # Update requirements.txt with latest versions
        python -c "
        import json
        import re
        
        with open('outdated.json') as f:
            outdated = json.load(f)
        
        with open('requirements.txt') as f:
            requirements = f.read()
        
        for pkg in outdated:
            pattern = rf'^{pkg[\"name\"]}==.*$'
            replacement = f'{pkg[\"name\"]}=={pkg[\"latest_version\"]}'
            requirements = re.sub(pattern, replacement, requirements, flags=re.MULTILINE)
        
        with open('requirements.txt', 'w') as f:
            f.write(requirements)
        "

    - name: Test updated dependencies
      if: env.found_requirements == 'true'
      run: |
        # Test that updated dependencies work
        pip install -r requirements.txt
        python -c "import sys; print('Python dependencies updated successfully')"

    - name: Create Pull Request for Python deps
      if: env.found_requirements == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update Python dependencies'
        title: 'Update Python dependencies'
        body: |
          This PR updates Python dependencies to their latest versions.
          
          **Changes:**
          - Updated versions in `requirements.txt`
          
          **Testing:**
          - [x] Verified that updated dependencies can be installed
          - [x] Basic import test passed
          
          This is an automated update created by the dependency update workflow.
        branch: update/python-deps
        delete-branch: true

  # Security vulnerability check
  security-check:
    name: Security Vulnerability Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check for known vulnerabilities in dependencies
      run: |
        # Check vcpkg dependencies for known vulnerabilities
        echo "Checking vcpkg dependencies for vulnerabilities..."
        
        # Extract dependency list from vcpkg.json
        jq -r '.dependencies[]' vcpkg.json | while read dep; do
          echo "Checking $dep..."
          # In a real implementation, you would check against vulnerability databases
        done

  # Dependency license check
  license-check:
    name: License Compatibility Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup dependencies for license scanning
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Check vcpkg dependency licenses
      run: |
        echo "# Dependency License Report" > license-report.md
        echo "Generated on: $(date)" >> license-report.md
        echo "" >> license-report.md
        
        echo "## vcpkg Dependencies" >> license-report.md
        jq -r '.dependencies[]' vcpkg.json | while read dep; do
          echo "- $dep: License information would be checked here" >> license-report.md
        done

    - name: Upload license report
      uses: actions/upload-artifact@v3
      with:
        name: license-report
        path: license-report.md

  # Create summary issue
  create-summary:
    name: Create Update Summary
    runs-on: ubuntu-latest
    needs: [update-vcpkg, update-submodules, update-python-deps, security-check, license-check]
    if: always() && github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v4

    - name: Create summary issue
      uses: actions/github-script@v6
      with:
        script: |
          const title = `Dependency Update Summary - ${new Date().toISOString().split('T')[0]}`;
          const body = `
          # Weekly Dependency Update Summary
          
          This issue summarizes the automated dependency update process.
          
          ## Update Status
          
          - **vcpkg baseline**: ${{ needs.update-vcpkg.result }}
          - **Git submodules**: ${{ needs.update-submodules.result }}
          - **Python dependencies**: ${{ needs.update-python-deps.result }}
          - **Security check**: ${{ needs.security-check.result }}
          - **License check**: ${{ needs.license-check.result }}
          
          ## Actions Taken
          
          Check the [Actions tab](${context.payload.repository.html_url}/actions) for detailed logs.
          
          ## Next Steps
          
          - Review any created pull requests
          - Address any security vulnerabilities found
          - Update documentation if needed
          
          This issue was created automatically by the dependency update workflow.
          `;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['dependencies', 'automated']
          });
