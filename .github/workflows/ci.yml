name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # Code quality and static analysis
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install code quality tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang-format clang-tidy
        pip install cpplint

    - name: Run cppcheck
      run: |
        cppcheck --enable=all --inconclusive --xml --xml-version=2 \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          --suppress=unusedFunction \
          atom/ 2> cppcheck-report.xml || true

    - name: Run clang-format check
      run: |
        find atom/ -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror

    - name: Run cpplint
      run: |
        find atom/ -name "*.cpp" -o -name "*.hpp" | xargs cpplint --filter=-whitespace/tab,-build/include_subdir

    - name: Upload code quality reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: code-quality-reports
        path: |
          cppcheck-report.xml

  # Build matrix for multiple platforms and configurations
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.build_system }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_system: [cmake, xmake]
        config: [Debug, Release]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows
          - os: macos-latest
            triplet: x64-osx

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'dbe35ceb30c688bf72e952ab23778e009a578f18'

    - name: Setup CMake
      if: matrix.build_system == 'cmake'
      uses: lukka/get-cmake@latest

    - name: Setup XMake
      if: matrix.build_system == 'xmake'
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ninja-build \
          libssl-dev zlib1g-dev libsqlite3-dev \
          libfmt-dev libreadline-dev \
          python3-dev doxygen graphviz

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install ninja openssl zlib sqlite3 fmt readline python3 doxygen graphviz

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install ninja doxygen.install graphviz

    - name: Configure and build with CMake
      if: matrix.build_system == 'cmake'
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
          -DATOM_BUILD_EXAMPLES=ON \
          -DATOM_BUILD_TESTS=ON \
          -DATOM_BUILD_PYTHON_BINDINGS=ON \
          -DATOM_BUILD_DOCS=ON \
          -G Ninja
        cmake --build build --config ${{ matrix.config }} --parallel

    - name: Configure and build with XMake
      if: matrix.build_system == 'xmake'
      run: |
        xmake config -m ${{ matrix.config }} --build_examples=y --build_tests=y --build_python=y
        xmake build

    - name: Run tests (CMake)
      if: matrix.build_system == 'cmake'
      run: |
        cd build
        ctest --output-on-failure --parallel

    - name: Run tests (XMake)
      if: matrix.build_system == 'xmake'
      run: |
        xmake test

    - name: Generate documentation
      if: matrix.os == 'ubuntu-latest' && matrix.build_system == 'cmake' && matrix.config == 'Release'
      run: |
        cmake --build build --target doc

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-${{ matrix.os }}-${{ matrix.build_system }}-${{ matrix.config }}
        path: |
          build/
          !build/**/*.o
          !build/**/*.obj
          !build/**/CMakeFiles/

    - name: Upload documentation
      if: matrix.os == 'ubuntu-latest' && matrix.build_system == 'cmake' && matrix.config == 'Release'
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: build/docs/

  # Python bindings test
  python-bindings:
    name: Python Bindings Test
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-ubuntu-latest-cmake-Release

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy

    - name: Test Python bindings
      run: |
        # Add Python bindings to path and test
        export PYTHONPATH=$PWD/build/python:$PYTHONPATH
        python -c "import atom; print('Python bindings loaded successfully')"

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: cpp

    - name: Build for CodeQL
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build libssl-dev zlib1g-dev
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
        cmake --build build --parallel

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # Performance benchmarks
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-ubuntu-latest-cmake-Release

    - name: Run benchmarks
      run: |
        # Run performance benchmarks if available
        if [ -f build/benchmarks/atom_benchmarks ]; then
          ./build/benchmarks/atom_benchmarks --benchmark_format=json > benchmark_results.json
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: benchmark-results
        path: benchmark_results.json
