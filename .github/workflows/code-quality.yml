name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"  # Weekly on Monday at 2 AM
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # Static analysis with multiple tools
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache analysis tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/apt
          key: ${{ runner.os }}-analysis-tools-${{ hashFiles('.github/workflows/code-quality.yml') }}
          restore-keys: |
            ${{ runner.os }}-analysis-tools-

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cppcheck clang-tidy clang-format \
            iwyu include-what-you-use \
            valgrind lcov cmake ninja-build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tools
        run: |
          pip install cpplint lizard complexity-report

      - name: Run cppcheck
        run: |
          cppcheck --enable=all \
            --inconclusive \
            --xml \
            --xml-version=2 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=unusedFunction \
            --suppress=noExplicitConstructor \
            --project=compile_commands.json \
            atom/ 2> cppcheck-report.xml || true

      - name: Run clang-tidy
        run: |
          # Generate compile commands using CMakePresets
          cmake --preset debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

          # Run clang-tidy on source files
          find atom/ -name "*.cpp" | head -20 | xargs -I {} \
            clang-tidy {} -p build/ \
            --checks='-*,readability-*,performance-*,modernize-*,bugprone-*,clang-analyzer-*' \
            --format-style=file > clang-tidy-report.txt 2>&1 || true

      - name: Run cpplint
        run: |
          find atom/ -name "*.cpp" -o -name "*.hpp" | \
            xargs cpplint \
            --filter=-whitespace/tab,-build/include_subdir,-legal/copyright \
            --counting=detailed \
            --output=vs7 > cpplint-report.txt 2>&1 || true

      - name: Check code formatting
        run: |
          find atom/ -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-format --dry-run --Werror --style=file || \
            (echo "Code formatting issues found. Run 'clang-format -i' on the files." && exit 1)

      - name: Run complexity analysis
        run: |
          lizard atom/ -l cpp -w -o lizard-report.html || true

      - name: Include What You Use (IWYU)
        run: |
          # Run IWYU on a subset of files to avoid overwhelming output
          find atom/ -name "*.cpp" | head -10 | xargs -I {} \
            include-what-you-use -I atom/ {} > iwyu-report.txt 2>&1 || true

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            cppcheck-report.xml
            clang-tidy-report.txt
            cpplint-report.txt
            lizard-report.html
            iwyu-report.txt
          retention-days: 30

  # Security analysis
  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Build for analysis
        run: |
          cmake --preset debug \
            -DATOM_BUILD_EXAMPLES=OFF \
            -DATOM_BUILD_TESTS=OFF \
            -DATOM_BUILD_PYTHON_BINDINGS=OFF \
            -DATOM_BUILD_DOCS=OFF
          cmake --build --preset debug --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/cpp

  # Memory safety analysis
  memory-safety:
    name: Memory Safety Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            valgrind clang \
            libssl-dev zlib1g-dev

      - name: Build with AddressSanitizer
        run: |
          cmake --preset debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DATOM_BUILD_TESTS=ON \
            -DATOM_BUILD_EXAMPLES=OFF \
            -DATOM_BUILD_PYTHON_BINDINGS=OFF \
            -DATOM_BUILD_DOCS=OFF
          cmake --build --preset debug --parallel

      - name: Build with MemorySanitizer
        run: |
          export CC=clang
          export CXX=clang++
          cmake --preset debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=memory -fno-omit-frame-pointer -g" \
            -DCMAKE_C_FLAGS="-fsanitize=memory -fno-omit-frame-pointer -g" \
            -DATOM_BUILD_TESTS=ON \
            -DATOM_BUILD_EXAMPLES=OFF \
            -DATOM_BUILD_PYTHON_BINDINGS=OFF \
            -DATOM_BUILD_DOCS=OFF
          cmake --build --preset debug --parallel

      - name: Run tests with AddressSanitizer
        run: |
          cd build
          if [ -f "./run_all_tests" ]; then
            echo "Running tests with unified test runner and AddressSanitizer..."
            ./run_all_tests --verbose --threads=2 || echo "Tests completed with issues under AddressSanitizer"
          else
            echo "Running tests with CTest and AddressSanitizer..."
            ctest --output-on-failure --timeout 300 || true
          fi

      - name: Run tests with Valgrind
        run: |
          cmake --preset debug \
            -DATOM_BUILD_TESTS=ON \
            -DATOM_BUILD_EXAMPLES=OFF \
            -DATOM_BUILD_PYTHON_BINDINGS=OFF \
            -DATOM_BUILD_DOCS=OFF
          cmake --build --preset debug --parallel
          cd build
          if [ -f "./run_all_tests" ]; then
            echo "Running tests with unified test runner and Valgrind..."
            timeout 600 ./run_all_tests --verbose --threads=1 || echo "Tests completed with issues under Valgrind"
          else
            echo "Running tests with CTest and Valgrind..."
            ctest --output-on-failure -T memcheck --timeout 600 || true
          fi

  # Performance analysis
  performance-analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            google-perftools libgoogle-perftools-dev \
            perf-tools-unstable

      - name: Build with profiling
        run: |
          cmake --preset relwithdebinfo \
            -DCMAKE_CXX_FLAGS="-pg -fprofile-arcs -ftest-coverage" \
            -DCMAKE_C_FLAGS="-pg -fprofile-arcs -ftest-coverage" \
            -DATOM_BUILD_TESTS=ON \
            -DATOM_BUILD_EXAMPLES=OFF \
            -DATOM_BUILD_PYTHON_BINDINGS=OFF \
            -DATOM_BUILD_DOCS=OFF
          cmake --build --preset relwithdebinfo --parallel

      - name: Run performance tests
        run: |
          cd build
          # Try unified test runner with performance category first
          if [ -f "./run_all_tests" ]; then
            echo "Running performance tests with unified test runner..."
            ./run_all_tests --category=performance --verbose || echo "Performance tests completed with issues"
          else
            # Fall back to traditional benchmarks
            if find . -name "*benchmark*" -executable; then
              echo "Running traditional benchmarks..."
              find . -name "*benchmark*" -executable -exec {} \;
            else
              echo "No performance tests found"
            fi
          fi

      - name: Generate coverage report
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: build/coverage.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}

  # Documentation quality
  documentation-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Check documentation completeness
        run: |
          # Generate documentation with warnings
          doxygen Doxyfile 2> doxygen-warnings.txt || true

          # Check for undocumented functions
          PATTERN="^[[:space:]]*[a-zA-Z_][a-zA-Z0-9_]*[[:space:]]*("
          find atom/ -name "*.hpp" -exec grep -l "$PATTERN" {} \; | \
            xargs -I {} sh -c 'echo "=== {} ==="; grep -n "$PATTERN" "{}" | head -5'

      - name: Check README and documentation files
        run: |
          # Check if README exists and has content
          if [ ! -f README.md ] || [ ! -s README.md ]; then
            echo "README.md is missing or empty"
            exit 1
          fi

          # Check for common documentation files
          for file in CONTRIBUTING.md CHANGELOG.md LICENSE; do
            if [ ! -f "$file" ]; then
              echo "Warning: $file is missing"
            fi
          done

      - name: Upload documentation warnings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-warnings
          path: doxygen-warnings.txt
          retention-days: 30

  # Test infrastructure validation
  test-infrastructure-validation:
    name: Test Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate unified testing infrastructure
        run: |
          echo "=== Validating Unified Testing Infrastructure ==="

          # Check if unified test runner source exists
          if [ ! -f "tests/run_all_tests.cpp" ]; then
            echo "❌ Unified test runner source missing"
            exit 1
          fi

          # Check if standardized templates exist
          if [ ! -f "tests/cmake/StandardTestTemplate.cmake" ]; then
            echo "❌ Standard test template missing"
            exit 1
          fi

          # Check if test documentation exists
          if [ ! -f "docs/TestingGuide.md" ]; then
            echo "❌ Testing documentation missing"
            exit 1
          fi

          # Check if cross-platform scripts exist
          if [ ! -f "scripts/run_tests.sh" ] || [ ! -f "scripts/run_tests.bat" ]; then
            echo "❌ Cross-platform test scripts missing"
            exit 1
          fi

          # Validate test module configurations
          echo "Validating test module configurations..."
          cd tests

          MODULES="algorithm async components connection containers error extra"
          MODULES="$MODULES image io log memory meta search secret serial"
          MODULES="$MODULES sysinfo system type utils web"
          for module_dir in $MODULES; do
            if [ -d "$module_dir" ]; then
              if [ -f "$module_dir/CMakeLists.txt" ]; then
                # Check if module uses standardized template
                if grep -q "StandardTestTemplate.cmake" "$module_dir/CMakeLists.txt"; then
                  echo "✅ $module_dir module uses standardized template"
                else
                  echo "⚠️ $module_dir module may need standardization"
                fi

                # Check if module has test files
                test_count=$(find "$module_dir" -name "test_*.cpp" -o -name "test_*.hpp" | wc -l)
                if [ "$test_count" -gt 0 ]; then
                  echo "✅ $module_dir module has $test_count test file(s)"
                else
                  echo "⚠️ $module_dir module has no test files"
                fi
              else
                echo "⚠️ $module_dir module missing CMakeLists.txt"
              fi
            fi
          done

          # Check main test CMakeLists.txt
          if [ -f "CMakeLists.txt" ]; then
            if grep -q "run_all_tests" "CMakeLists.txt"; then
              echo "✅ Main test CMakeLists.txt includes unified test runner"
            else
              echo "❌ Main test CMakeLists.txt missing unified test runner"
              exit 1
            fi
          fi

          # Validate test script functionality
          echo "Validating test script functionality..."
          cd ..
          if [ -f "scripts/run_tests.sh" ]; then
            if bash scripts/run_tests.sh --help > /dev/null 2>&1; then
              echo "✅ Unix test script is functional"
            else
              echo "⚠️ Unix test script may have issues"
            fi
          fi

          echo "✅ Test infrastructure validation completed"

      - name: Validate test build configuration
        run: |
          echo "=== Validating Test Build Configuration ==="

          # Try to configure tests with CMake
          cmake -B test-build \
            -DATOM_BUILD_TESTS=ON \
            -DATOM_BUILD_EXAMPLES=OFF \
            -DATOM_BUILD_DOCS=OFF \
            -DATOM_BUILD_PYTHON_BINDINGS=OFF

          if [ $? -eq 0 ]; then
            echo "✅ Test configuration successful"

            # Check if unified test runner target exists
            if grep -q "run_all_tests" test-build/CMakeFiles/Makefile.cmake 2>/dev/null; then
              echo "✅ Unified test runner target configured"
            else
              echo "⚠️ Unified test runner target not found in configuration"
            fi
          else
            echo "❌ Test configuration failed"
            exit 1
          fi

          # Clean up
          rm -rf test-build

      - name: Check test integration with CI
        run: |
          echo "=== Validating CI Test Integration ==="

          # Check if test workflow exists
          if [ ! -f ".github/workflows/tests.yml" ]; then
            echo "❌ Dedicated test workflow missing"
            exit 1
          fi

          # Check if main CI workflow includes tests
          if grep -q "run_all_tests" ".github/workflows/ci.yml"; then
            echo "✅ Main CI workflow integrates unified test runner"
          else
            echo "⚠️ Main CI workflow may need test integration update"
          fi

          # Check if test workflow uses unified runner
          if grep -q "run_all_tests" ".github/workflows/tests.yml"; then
            echo "✅ Test workflow uses unified test runner"
          else
            echo "❌ Test workflow doesn't use unified test runner"
            exit 1
          fi

          echo "✅ CI test integration validation completed"

      - name: Upload test infrastructure validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-infrastructure-validation
          path: |
            test-infrastructure-report.txt
          retention-days: 30

  # Dependency analysis
  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyze dependencies
        run: |
          # Check for circular dependencies
          find atom/ -name "*.hpp" -exec grep -l "#include" {} \; | \
            xargs -I {} sh -c 'echo "=== {} ==="; grep "#include.*atom/" "{}"' > dependency-analysis.txt

      - name: Check for unused includes
        run: |
          # This is a simplified check - in practice, you'd use include-what-you-use
          find atom/ -name "*.cpp" -exec grep -H "#include" {} \; > includes.txt

      - name: Upload dependency analysis
        uses: actions/upload-artifact@v4
        with:
          name: dependency-analysis
          path: |
            dependency-analysis.txt
            includes.txt
          retention-days: 30

  # Generate quality report
  quality-report:
    name: Generate Quality Report
    runs-on: ubuntu-latest
    needs:
      [
        static-analysis,
        security-analysis,
        memory-safety,
        documentation-quality,
        dependency-analysis,
        test-infrastructure-validation,
      ]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all analysis reports
        uses: actions/download-artifact@v4
        with:
          path: reports/

      - name: Generate quality summary
        run: |
          echo "# Code Quality Report" > quality-report.md
          echo "Generated on: $(date)" >> quality-report.md
          echo "" >> quality-report.md

          echo "## Static Analysis Results" >> quality-report.md
          if [ -f reports/static-analysis-reports/cppcheck-report.xml ]; then
            echo "- Cppcheck report available" >> quality-report.md
          fi

          echo "## Security Analysis" >> quality-report.md
          echo "- CodeQL analysis completed" >> quality-report.md

          echo "## Memory Safety" >> quality-report.md
          echo "- AddressSanitizer and Valgrind tests completed" >> quality-report.md

          echo "## Documentation Quality" >> quality-report.md
          DOXY_WARN="reports/documentation-warnings/doxygen-warnings.txt"
          if [ -f "$DOXY_WARN" ]; then
            echo "- Doxygen warnings: $(wc -l < $DOXY_WARN) lines" >> quality-report.md
          fi

          echo "## Test Infrastructure Quality" >> quality-report.md
          if [ -d reports/test-infrastructure-validation ]; then
            echo "- Unified test infrastructure validation completed" >> quality-report.md
            echo "- Standardized templates validated" >> quality-report.md
            echo "- Cross-platform script functionality verified" >> quality-report.md
            echo "- CI/CD integration confirmed" >> quality-report.md
          else
            echo "- Test infrastructure validation failed or was skipped" >> quality-report.md
          fi

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.md
          retention-days: 30
